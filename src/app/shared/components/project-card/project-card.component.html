<div [class]="projectcardClasses">
  @if (imageUrl) {
    <div class="relative overflow-hidden aspect-video bg-slate-100 dark:bg-slate-800 border-b border-slate-100 dark:border-slate-800">
      <img
        src="assets/icons/portfolio.png"
        [src]="imageUrl"
        [alt]="imageAlt || title || 'Image de projet'"
        [title]="imageAlt || title || 'Image de projet'"
        loading="lazy"
        (error)="onImageError($event)"
        class="w-full h-full object-cover transition-transform duration-500 hover:scale-105"
      />
    </div>
  }
  
  <div class="p-6 flex flex-col flex-1">
    @if (title) {
      <h3 class="text-xl font-bold mb-2 text-slate-900 dark:text-white">
        {{ title }}
      </h3>
    }
    @if (description) {
      <p class="text-slate-600 dark:text-slate-300 text-sm mb-4 leading-relaxed">
        {{ description }}
      </p>
    }
    
    <ng-content></ng-content>
  </div>
</div>
