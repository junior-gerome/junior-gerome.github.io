<nav
  class="fixed top-0 left-0 right-0 z-40 bg-white/85 dark:bg-slate-950/85 backdrop-blur-md border-b border-slate-200/80 dark:border-slate-800/80 transition-colors duration-200"
>
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="flex justify-between items-center h-16">
      <!-- Brand Logo -->
      <a routerLink="/" class="flex items-center space-x-3 group" (click)="closeMobileMenu()">
        <div
          class="w-9 h-9 bg-primary-600 text-white rounded-lg flex items-center justify-center font-bold text-sm tracking-wider shadow-sm transition-transform duration-200 group-hover:scale-105"
        >
          NG
        </div>
        <div class="flex flex-col">
          <span class="font-bold text-slate-900 dark:text-white text-base leading-tight">
            Junior Gerome
          </span>
          <span class="hidden sm:inline-flex items-center gap-1.5 text-xs text-slate-500 dark:text-slate-400 font-mono">
            <span class="w-1.5 h-1.5 rounded-full bg-emerald-500"></span>
            Full Stack Engineer
          </span>
        </div>
      </a>

      <!-- Desktop Navigation Menu -->
      <div class="hidden md:flex items-center space-x-1" role="navigation" aria-label="Menu principal">
        @for (link of navLinks; track link.path) {
          <a
            [routerLink]="link.path"
            routerLinkActive="bg-slate-100 dark:bg-slate-800 text-primary-600 dark:text-primary-400 font-semibold"
            [routerLinkActiveOptions]="{ exact: link.path === '/' }"
            class="px-3.5 py-1.5 rounded-lg text-sm font-medium text-slate-700 dark:text-slate-300 hover:text-slate-900 dark:hover:text-white hover:bg-slate-100/70 dark:hover:bg-slate-800/50 transition-colors"
          >
            {{ link.label }}
          </a>
        }
      </div>

      <!-- Actions: Theme Toggle & Mobile Menu -->
      <div class="flex items-center space-x-2">
        <!-- Theme Switcher with crisp SVG icons -->
        <button
          (click)="toggleTheme()"
          type="button"
          class="p-2 rounded-lg text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800/80 transition-colors cursor-pointer focus-visible:ring-2 focus-visible:ring-primary-500"
          [attr.aria-label]="themeService.isDarkMode() ? 'Passer au mode clair' : 'Passer au mode sombre'"
        >
          @if (themeService.isDarkMode()) {
            <!-- Sun Icon -->
            <svg class="w-5 h-5 text-amber-400 transition-transform duration-300 rotate-0 hover:rotate-45" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z" />
            </svg>
          } @else {
            <!-- Moon Icon -->
            <svg class="w-5 h-5 text-slate-700 transition-transform duration-300 -rotate-12 hover:rotate-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" />
            </svg>
          }
        </button>

        <!-- Mobile Menu Toggle Button -->
        <button
          (click)="toggleMobileMenu()"
          type="button"
          class="md:hidden p-2 rounded-lg text-slate-700 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800/80 cursor-pointer focus-visible:ring-2 focus-visible:ring-primary-500"
          [attr.aria-label]="mobileMenuOpen ? 'Fermer le menu' : 'Ouvrir le menu'"
          [attr.aria-expanded]="mobileMenuOpen"
        >
          <svg
            class="w-6 h-6"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
          >
            @if (!mobileMenuOpen) {
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M4 6h16M4 12h16M4 18h16"
              />
            } @else {
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M6 18L18 6M6 6l12 12"
              />
            }
          </svg>
        </button>
      </div>
    </div>

    <!-- Mobile Dropdown Menu -->
    @if (mobileMenuOpen) {
      <div class="md:hidden py-3 px-2 border-t border-slate-200 dark:border-slate-800 space-y-1 animate-fade-in bg-white/95 dark:bg-slate-950/95">
        @for (link of navLinks; track link.path) {
          <a
            [routerLink]="link.path"
            routerLinkActive="bg-slate-100 dark:bg-slate-800 text-primary-600 dark:text-primary-400 font-semibold"
            [routerLinkActiveOptions]="{ exact: link.path === '/' }"
            (click)="closeMobileMenu()"
            class="block px-3.5 py-2.5 rounded-lg text-sm font-medium text-slate-700 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800/80 transition-colors"
          >
            {{ link.label }}
          </a>
        }
      </div>
    }
  </div>
</nav>
